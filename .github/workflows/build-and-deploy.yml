name: Build and deploy

on:
  push:
    tags:
      - '*'

jobs:
  build-frontend:
    name: Build and push frontend image to Docker Hub
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/rerum-imperium
          tags: |
            type=semver,pattern={{version}}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}

  build-backend:
    name: Build and push backend image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/rerum-imperium-backend
          tags: |
            type=semver,pattern={{version}}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}

  deploy:
    name: Deploy to Portainer
    needs:
      - build-frontend
      - build-backend
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy Portainer stack
        env:
          PORTAINER_URL: ${{ vars.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
          ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID }}
          VERSION: ${{ needs.build-frontend.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          base = os.environ["PORTAINER_URL"].rstrip("/")
          key = os.environ["PORTAINER_API_KEY"]
          sid = os.environ["STACK_ID"]
          eid = os.environ["ENDPOINT_ID"]
          version = os.environ["VERSION"]

          def req(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(
                  base + path,
                  method=method,
                  data=data,
                  headers={"X-API-Key": key, "Content-Type": "application/json"},
              )
              with urllib.request.urlopen(r, timeout=60) as resp:
                  raw = resp.read()
                  return json.loads(raw) if raw else {}

          stack = req("GET", f"/api/stacks/{sid}")
          file_content = req("GET", f"/api/stacks/{sid}/file")["StackFileContent"]

          env = stack.get("Env") or []
          found = False
          for e in env:
              if e.get("name") == "VERSION":
                  e["value"] = version
                  found = True
          if not found:
              env.append({"name": "VERSION", "value": version})

          payload = {
              "env": env,
              "stackFileContent": file_content,
              "prune": False,
              "pullImage": True,
          }
          req("PUT", f"/api/stacks/{sid}?endpointId={eid}", payload)
          print(f"Portainer stack {sid} redeployed with VERSION={version}")
          PY
